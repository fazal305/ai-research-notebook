<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Research Notebook — a local-first research workspace for browser-based document analysis. Write and organize research, run AI analysis both locally and in the cloud, and keep everything on your own machine." />
    <title>AI Research Notebook — Local-First Research Workspace</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="AI Research Notebook — Local-First Research Workspace" />
    <meta property="og:description" content="A local-first research workspace for browser-based document analysis. Write and organize research, run AI analysis both locally and in the cloud, and keep everything on your own machine." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Research Notebook — Local-First Research Workspace" />
    <meta name="twitter:description" content="A local-first research workspace for browser-based document analysis. Write and organize research, run AI analysis both locally and in the cloud, and keep everything on your own machine." />
    <script>
      // Applied before first paint so the correct theme renders immediately —
      // doing this in React (useEffect) would flash the wrong theme first.
      (function () {
        try {
          var stored = localStorage.getItem('ai-research-notebook:theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
